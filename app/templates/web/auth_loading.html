{% extends "web/base.html" %}

{% block title %}Connecting... - Your Brief{% endblock %}

{% block content %}
<style>
    .loading-container {
        max-width: 500px;
        margin: 80px auto;
        text-align: center;
    }
    .spinner {
        width: 50px;
        height: 50px;
        margin: 0 auto 30px;
        border: 5px solid #ecf0f1;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    h1 {
        color: #2c3e50;
        margin-bottom: 15px;
    }
    p {
        color: #7f8c8d;
        font-size: 16px;
    }
</style>

<div class="loading-container">
    <div class="spinner"></div>
    <h1>Connecting your Gmail account...</h1>
    <p>This will only take a moment.</p>
    <p style="margin-top: 20px; font-size: 14px;">
        We're setting up read-only access to your Gmail.<br>
        You'll be redirected automatically when done.
    </p>
</div>
{% endblock %}
